<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="phBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2E1F"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <radialGradient id="phGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#166534" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0B2E1F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#phBg)"/>
  <rect width="800" height="500" fill="url(#phGlow)"/>

  <!-- Subtle border pattern -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="none" stroke="#C9A227" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.4"/>

  <!-- Center Crest Badge -->
  <g transform="translate(340, 150)">
    <circle cx="60" cy="60" r="54" fill="#0B2E1F" stroke="#C9A227" stroke-width="2.5"/>
    <circle cx="60" cy="60" r="44" fill="#14532D" stroke="#C9A227" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="60" y="72" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="38" font-weight="700" fill="#E9C95C" text-anchor="middle">সা</text>
  </g>

  <!-- Placeholder Bengali Text -->
  <text x="400" y="320" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="22" font-weight="600" fill="#FAF7EE" text-anchor="middle" letter-spacing="0.5">
    প্রকৃত ছবি পরে বসবে
  </text>

  <!-- English Subtext -->
  <text x="400" y="350" font-family="'Hind Siliguri', sans-serif" font-size="14" font-weight="400" fill="#A8B5AB" text-anchor="middle" letter-spacing="1">
    Satanipara Somaj Kallyan Sangha • Actual photo placeholder
  </text>
</svg>