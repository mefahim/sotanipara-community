<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2E1F"/>
      <stop offset="50%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#071E14"/>
    </linearGradient>
    <radialGradient id="heroLight" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#166534" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#0B2E1F" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#061910" stop-opacity="1"/>
    </radialGradient>
    <pattern id="villageGeometry" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 0 40 L 40 0 L 80 40 L 40 80 Z" fill="none" stroke="#C9A227" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="40" cy="40" r="1.5" fill="#C9A227" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#heroGradient)"/>
  <rect width="1600" height="900" fill="url(#heroLight)"/>
  <rect width="1600" height="900" fill="url(#villageGeometry)"/>

  <!-- Subtle village silhouettes / landscape wave at bottom -->
  <path d="M0 720 Q 350 680, 700 730 T 1400 710 T 1600 740 L 1600 900 L 0 900 Z" fill="#061910" fill-opacity="0.8"/>
  <path d="M0 770 Q 400 740, 800 770 T 1600 760 L 1600 900 L 0 900 Z" fill="#04120B" fill-opacity="0.9"/>
</svg>